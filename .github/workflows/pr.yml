name: Build and test tank game

on:
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Format code
      run: |
        cargo fmt
        # Check if cargo fmt modified any files and commit them if it did
        if [ -n "$(git status --porcelain 2>/dev/null)" ]; then
          git \
            -c user.name="Ryan Ray (ci)" \
            -c user.email="ryan3r@users.noreply.github.com" \
            commit \
              --all \
              --message="Run cargo fmt (CI)"
          # Pushing will not retrigger 
          git push HEAD:$GITHUB_HEAD_REF
        fi
      working-directory: core
    - name: Build
      run: cargo build --verbose
      working-directory: core
    - name: Run tests
      run: cargo test --verbose
      working-directory: core
